name: Build

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Add i686 target
        run: rustup target add i686-pc-windows-msvc

      - name: Build and package the mod
        shell: pwsh
        run: cargo xtask build

      - name: Build and package the TAS editor (Rust)
        shell: pwsh
        run: cargo xtask pack-editor --skip-cargo

      - name: Build and package the TAS CLI
        shell: pwsh
        run: cargo xtask build-tools

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: drmod-rs
          path: out/drmod-rs.zip

      - name: Upload ASI artifact
        uses: actions/upload-artifact@v5
        with:
          name: drmod-asi
          path: out/drmod-asi.zip

      - name: Upload TAS editor (Rust) artifact
        uses: actions/upload-artifact@v5
        with:
          name: drmod-tas-editor
          path: out/drmod-tas-editor.zip

      - name: Upload TAS CLI artifact
        uses: actions/upload-artifact@v5
        with:
          name: drmod-tas
          path: out/drmod-tas.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/drmod-rs.zip
            out/drmod-asi.zip
            out/drmod-tas-editor.zip
            out/drmod-tas.zip

  upload-s3:
    name: Upload to Yandex S3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: drmod-rs
          path: dist

      - name: Unzip artifact
        run: |
          mkdir -p dist/unpacked
          unzip dist/drmod-rs.zip -d dist/unpacked

      - name: Fetch S3 secrets from Lockbox
        id: lockbox
        uses: yc-actions/yc-lockbox@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          secret-id: ${{ vars.LOCKBOX_SECRET_ID }}

      - name: Upload to Yandex Object Storage
        uses: nekitcorp/yandex-storage-website-action@v2
        with:
          access-key-id: ${{ steps.lockbox.outputs.S3_API_KEY_ID }}
          secret-access-key: ${{ steps.lockbox.outputs.S3_API_KEY_VALUE }}
          bucket: drmod
          clear: true
          working-directory: dist/unpacked
          include: |
            **/*
