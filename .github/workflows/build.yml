name: Build

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Add i686 target
        run: rustup target add i686-pc-windows-msvc

      - name: Install UPX
        run: choco install upx -y

      - name: Build, compress, package
        shell: pwsh
        run: .\build.ps1

      - name: Build TAS editor (C#)
        shell: pwsh
        run: |
          .\tas-editor-cs\pack.ps1 `
            -Build `
            -PublishDir .\tas-editor-cs\publish `
            -OutDir .\tas-editor-cs\out\tas-editor `
            -Zip `
            -ZipPath .\out\tas-editor-cs.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: drmod-rs
          path: out/drmod-rs.zip

      - name: Upload TAS editor artifact
        uses: actions/upload-artifact@v5
        with:
          name: tas-editor-cs
          path: out/tas-editor-cs.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/drmod-rs.zip
            out/tas-editor-cs.zip

  upload-s3:
    name: Upload to Yandex S3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: drmod-rs
          path: dist

      - name: Unzip artifact
        run: |
          mkdir -p dist/unpacked
          unzip dist/drmod-rs.zip -d dist/unpacked

      - name: Fetch S3 secrets from Lockbox
        id: lockbox
        uses: yc-actions/yc-lockbox@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          secret-id: ${{ vars.LOCKBOX_SECRET_ID }}

      - name: Upload to Yandex Object Storage
        uses: nekitcorp/yandex-storage-website-action@v2
        with:
          access-key-id: ${{ steps.lockbox.outputs.S3_API_KEY_ID }}
          secret-access-key: ${{ steps.lockbox.outputs.S3_API_KEY_VALUE }}
          bucket: drmod
          clear: true
          working-directory: dist/unpacked
          include: |
            **/*
