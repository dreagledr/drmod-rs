[package]
name = "drmod-script"
version.workspace = true
edition = "2024"
description = "The Metal Gear Rising script formats (DSL text, API JSON, frames) and the record -> script converter"

# A library shared by the mod (i686, via `drmod-core`), the TAS editor and the CLI. The formats
# are the contract between all of them, so they live in one place.
[dependencies]
drmod-replay-types = { path = "../drmod-replay-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
