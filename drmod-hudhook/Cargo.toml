[package]
name = "drmod-hudhook"
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
description = "A fork of hudhook, cut down to DirectX 9 for Metal Gear Rising: Revengeance."
license-file = "LICENSE"

[features]
default = ["dx9", "inject"]
dx9 = []
inject = []
imgui-freetype = ["imgui/freetype"]
imgui-docking = ["imgui/docking"]
imgui-tables-api = ["imgui/tables-api"]

[[example]]
name = "simple_hook"
crate-type = ["cdylib"]

[[example]]
name = "hook_with_image"
crate-type = ["cdylib"]

[[example]]
name = "injector"
crate-type = ["bin"]

[[example]]
name = "demo_hook_dx9"
crate-type = ["cdylib"]

[dependencies]
bitflags = "2.5.0"
imgui = "0.12"
once_cell = { version = "1.18.0", default-features = false }
parking_lot = "0.12"
tracing = { version = "0.1", features = ["log"], default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"], default-features = false }
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D9",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
dotenv = "0.15.0"
image = "0.24.8"
tracing-subscriber = "0.3"

[build-dependencies]
cc = "1.0.72"

[[test]]
name = "dx9"
path = "tests/dx9.rs"

[[test]]
name = "hook"
path = "tests/hook.rs"

[[test]]
name = "inject"
path = "tests/inject.rs"
