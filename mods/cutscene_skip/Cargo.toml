[package]
name = "cutscene-skip"
version = "0.1.0"
edition = "2024"

# Самостоятельный крейт: не входит в корневой workspace drmod-rs — вынос в
# отдельный репозиторий = перенос этой папки целиком.
[workspace]

[lib]
name = "cutscene_skip_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cutscene_skip"
path = "src/main.rs"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
cc = "1"

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
# Детур хука всё равно не может разворачивать стек через границу extern "system"
# (Rust аварийно завершает процесс) — unwind-таблицы не нужны, экономия размера.
# `cargo test` идёт по dev-профилю и не затронут.
panic = "abort"
