[package]
name = "tas-editor"
version = "0.1.0"
edition = "2024"
description = "TAS Editor for Metal Gear Rising: Revengeance - WinUI 3 desktop app on windows-reactor"
publish = false

# Собственный workspace: корневой drmod-rs не должен тянуть GUI-крейт x64 в 32-битную сборку.
[workspace]

[dependencies]
windows-reactor = "0.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# FolderPicker (IFileOpenDialog) для выбора рабочей области.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[build-dependencies]
windows-reactor-setup = "0.100"

# Headless-тесты раскладки: RecordingRuntime и Pump доступны только с фичей `test`.
[dev-dependencies]
windows-reactor = { version = "0.100", features = ["test"] }
