[package]
name = "drmod-injector"
version.workspace = true
edition = "2024"

[dependencies]
drmod_rs_lib = { path = "../drmod-core", package = "drmod-core" }
drmod-hudhook = { path = "../drmod-hudhook" }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[[bin]]
name = "drmod"
path = "src/main.rs"
