[package]
name = "drmod-rs"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["protocol", "server", "replay-types", "tools/dbdump"]

[dependencies]
drmod-protocol = { path = "protocol" }
drmod-replay-types = { path = "replay-types" }
hudhook = { path = "vendor/hudhook" }
imgui = "0.12.0"
windows-numerics = "0.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Direct3D",
    "Win32_System_Kernel",
]

[profile.release]
strip = true
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "drmod_rs_lib"

[[bin]]
name = "drmod"
path = "src/main.rs"
