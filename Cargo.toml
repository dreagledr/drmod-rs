[workspace]
# The edition-2024 resolver: every member is edition 2024, so resolver "1" (the virtual-workspace
# default) was wrong and cargo warned on every invocation.
resolver = "3"
members = [
    "drmod-core",
    "drmod-injector",
    "drmod-protocol",
    "drmod-replay-types",
    "drmod-script",
    "drmod-server",
    "drmod-cli",
    "drmod-dbdump",
    "drmod-script-gen",
    "drmod-hudhook",
]

# Plain `cargo build`/`cargo test` from the root builds only the i686 mod and the libs it shares.
# The x64 crates are members but not default members: cargo resolves `.cargo/config.toml` by cwd, not
# by package, so including them here would cross-compile `arrow`/`axum` to i686 for nothing. Reach
# them with the root aliases (`cargo dbdump` / `cargo script-gen` / `cargo server` / `cargo editor`)
# or `cargo xtask`; an explicit `-p <crate> --target x86_64-pc-windows-msvc` still works.
default-members = [
    "drmod-core",
    "drmod-injector",
    "drmod-protocol",
    "drmod-replay-types",
    "drmod-hudhook",
]

# The release version is the git tag (`vX.Y.Z`) and lives here once. Every first-party member inherits
# it with `version.workspace = true`; the editor has its own `[workspace.package]` because it is a
# separate workspace, and `drmod-hudhook` keeps 0.9.0 as the vendored fork tracking upstream.
[workspace.package]
version = "0.1.6"

[profile.release]
strip = true
opt-level = "s"
lto = true

# Test profile for the whole workspace. `overflow-checks` are off and LTO is on
# because drmod-hudhook's DX9 test harness drives a real device; a debug-speed
# build there is pointlessly slow. Profiles live at the workspace root — a
# `[profile.test]` inside a member manifest is ignored.
[profile.test]
opt-level = 3
overflow-checks = false
lto = "thin"
