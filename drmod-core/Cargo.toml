[package]
name = "drmod-core"
version.workspace = true
edition = "2024"

[dependencies]
drmod-protocol = { path = "../drmod-protocol" }
drmod-replay-types = { path = "../drmod-replay-types" }
drmod-script = { path = "../drmod-script" }
drmod-hudhook = { path = "../drmod-hudhook" }
imgui = "0.12.0"
windows-numerics = "0.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Приём `Content-Encoding: gzip` в HTTP API. Чистый Rust (miniz_oxide) — без
# C-сборки: DLL инжектируется в 32-битный процесс, лишняя C-зависимость не нужна.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Direct3D",
    "Win32_System_Kernel",
]

[lib]
crate-type = ["cdylib", "rlib"]
name = "drmod_rs_lib"
