[package]
name = "drmod-server"
version = "0.1.0"
edition = "2024"

[dependencies]
drmod-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
